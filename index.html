<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetería de Santi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Cafetería de Santi</h1>
        <p>Elegí tus productos y armá tu pedido.</p>
        <p id="aviso"></p>
    </header>

    <main>
        <section>
            <h2>Productos</h2>
            <div id="contenedorProductos" class="productos"></div>
        </section>

        <section class="carrito">
            <h2>Tu pedido</h2>
            <div id="contenedorCarrito"></div>
            <p id="total">Total: $0</p>
            <button id="finalizarCompra">Finalizar compra</button>
            <p id="mensaje"></p>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
